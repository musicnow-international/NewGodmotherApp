<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godmother Professional Sequence</title>
    <style>
        :root {
            --bg-color: #040305;
            --accent-gold: #ffd700;
            --accent-gold-glow: rgba(255, 215, 0, 0.6);
            --text-color: #fffaf0;
            --panel-bg: rgba(15, 10, 20, 0.92);
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Control Panel / Trigger Button */
        #triggerBtn {
            position: absolute;
            top: 30px;
            z-index: 10;
            background: linear-gradient(135deg, var(--accent-gold), #b38b27);
            color: #0c0a0e;
            border: none;
            padding: 14px 34px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.8px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--accent-gold-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.3s ease;
        }

        #triggerBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
        }

        #triggerBtn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Stage Container */
        #godmotherContainer {
            position: absolute;
            bottom: 0;
            left: -400px;
            width: 320px;
            height: 470px;
            z-index: 5;
            display: none;
            transform-origin: bottom center;
        }

        /* Visual Asset Layer */
        #visual {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            filter: drop-shadow(0 0 15px rgba(230, 197, 107, 0.2));
        }

        /* Cinematic Entrance Animation */
        .gm-walking {
            display: block !important;
            animation: dramaticWalkIntoStage 3.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes dramaticWalkIntoStage {
            0% { left: -400px; transform: translateY(20px) rotate(-5deg) scale(0.9); }
            25% { transform: translateY(-12px) rotate(3deg) scale(0.95); }
            50% { left: calc(50% - 160px); transform: translateY(0px) rotate(-2deg) scale(1); }
            75% { transform: translateY(-8px) rotate(2deg) scale(1.02); }
            100% { left: calc(50% - 160px); transform: translateY(0px) rotate(0deg) scale(1); }
        }

        /* Theatrical Mannerisms / Speaking Loop */
        .gm-speaking {
            display: block !important;
            left: calc(50% - 160px) !important;
            animation: theatricalMannerisms 3s infinite alternate ease-in-out;
        }

        @keyframes theatricalMannerisms {
            0% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 0 10px rgba(230, 197, 107, 0.3)); }
            33% { transform: translateY(-6px) scale(1.02) rotate(-1deg); filter: drop-shadow(0 0 25px rgba(255, 223, 128, 0.6)); }
            66% { transform: translateY(-2px) scale(1.01) rotate(1.5deg); filter: drop-shadow(0 0 15px rgba(230, 197, 107, 0.4)); }
            100% { transform: translateY(-8px) scale(1.03) rotate(-0.5deg); filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.8)); }
        }

        /* Grand Cinematic Vanish */
        .gm-vanish #visual {
            opacity: 0;
            transform: scale(2.8) rotate(12deg);
            filter: brightness(15) contrast(3) drop-shadow(0 0 80px #ffffff) drop-shadow(0 0 150px var(--accent-gold));
            transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.6s ease-out;
        }

        /* Subtitle / Caption Box */
        #captionBox {
            position: absolute;
            bottom: 45px;
            width: 80%;
            max-width: 650px;
            text-align: center;
            color: var(--text-color);
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.95);
            background: var(--panel-bg);
            padding: 18px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 8;
        }

        #captionBox.show-caption {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Particle Sparkle FX */
        .sparkle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 12px #fff, 0 0 25px var(--accent-gold), 0 0 40px #ffaa00;
            animation: burstSparkle 1.1s forwards cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        @keyframes burstSparkle {
            0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <button id="triggerBtn">▶ Play Sequence</button>

    <div id="captionBox"></div>

    <audio id="godmotherVoice" preload="auto"></audio>

    <div id="godmotherContainer">
        <div id="visual"></div>
    </div>

    <script>
        /**
         * =========================================================================
         * CENTRAL CONFIGURATION & MANIFEST (Edit app parameters here safely)
         * =========================================================================
         */
        const APP_CONFIG = {
            visualAssetUrl: 'https://raw.githubusercontent.com/musicnow-international/NewGodmotherApp/main/grok_1787634242926.png',
            audioAssetUrl: 'https://raw.githubusercontent.com/musicnow-international/NewGodmotherApp/main/ElevenLabs_2026-08-25T00_18_39_God-mother_eleven_multilingual_v2.mp3',
            entranceDurationMs: 3200, // Time allocated for the walk-in animation before speech sync starts
            sparkleCount: 50,
            
            // Synchronized script timings and text captions
            scriptTimings: [
                { time: 0.0, text: "Hello, my dear..." },
                { time: 2.5, text: "I have been watching over you." },
                { time: 5.0, text: "Remember that magic lives within your heart." },
                { time: 8.0, text: "Go forth and shine!" }
            ]
        };

        // Initialize DOM elements and configuration bindings
        const btn = document.getElementById('triggerBtn');
        const container = document.getElementById('godmotherContainer');
        const audio = document.getElementById('godmotherVoice');
        const visualLayer = document.getElementById('visual');
        const captionBox = document.getElementById('captionBox');

        // Bind assets dynamically from configuration
        visualLayer.style.backgroundImage = `url('${APP_CONFIG.visualAssetUrl}')`;
        audio.src = APP_CONFIG.audioAssetUrl;

        let captionInterval;

        function updateCaptions(currentTime) {
            let activeText = "";
            for (let i = 0; i < APP_CONFIG.scriptTimings.length; i++) {
                if (currentTime >= APP_CONFIG.scriptTimings[i].time) {
                    activeText = APP_CONFIG.scriptTimings[i].text;
                }
            }
            if (activeText) {
                captionBox.textContent = activeText;
                captionBox.classList.add('show-caption');
            }
        }

        function createSparkles() {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < APP_CONFIG.sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                const size = Math.random() * 8 + 4;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${centerX}px`;
                sparkle.style.top = `${centerY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 250 + 50;
                sparkle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                sparkle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);

                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1100);
            }
        }

        btn.addEventListener('click', () => {
            // Unlock audio context for mobile/browsers
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(err => console.log("Audio unlock notice:", err));

            btn.classList.add('hidden');
            container.className = '';
            captionBox.className = '';
            captionBox.textContent = '';
            clearInterval(captionInterval);

            // Execute entrance animation sequence
            container.classList.add('gm-walking');

            setTimeout(() => {
                // Shift into active speaking mannerisms once center stage is reached
                container.className = '';
                container.classList.add('gm-speaking');
                
                audio.play().catch(e => console.log("Playback error:", e));

                captionInterval = setInterval(() => {
                    updateCaptions(audio.currentTime);
                }, 100);

                audio.onended = () => {
                    clearInterval(captionInterval);
                    captionBox.classList.remove('show-caption');
                    
                    container.classList.remove('gm-speaking');
                    container.classList.add('gm-vanish');
                    
                    createSparkles();

                    setTimeout(() => {
                        container.className = ''; 
                        btn.classList.remove('hidden');
                    }, 800);
                };

            }, APP_CONFIG.entranceDurationMs);
        });
    </script>
</body>
</html>
